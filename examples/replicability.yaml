# gmri replicability run examples/replicability.yaml
# Template; every option: docs/configuration.md
input: results/data/tracer.parquet
subject_info: subjects.csv   # only needed with stratify_by
output_dir: results/replicability/parafac2_halfhalf
method: parafac2
ranks: [2, 3, 4]
tensor:
  scale: true
  center: false              # subtract per-label means (needs non_negative_modes: none)
  min_timepoints: null
  max_invalid_fraction: 0.9
fit:
  restarts: 20
  max_iter: 2000
  tolerance: 1e-5
  non_negative_modes: auto   # auto | none | modes, 0 subject, 1 time, 2 label
  options: {}
engine: halfhalf             # halfhalf | cv
repeats: 20
splits: 5                    # cv only
stratify_by: diagnosis       # optional subject_info column
n_procs: 4
seed: 0
distributed:                 # for `plan` / `run --job N` / `collect`
  store: restarts            # per-restart results, relative to output_dir
  tasks_per_job: 4
