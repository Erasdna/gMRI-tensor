# gmri preprocess examples/preprocessing.yaml
# Paths are relative to this file.
manifest: scans.csv       # subject,time_point,baseline_path,post_injection_path,mask_path,segmentation_path
output_dir: results       # writes results/data/
signal_type: T1map        # T1map | R1map | T1w
aggregation: median       # median | mean | voxel (one row per voxel)
relaxivity: 3.2           # r1 in 1/(mM s); null -> no concentration columns
time_unit: ms             # unit of the T1/R1 maps: ms | s
n_procs: 5
regions:
  presets: [ventricles, white_matter, cortical_grey_matter, limbic_system, all_csf]
  custom:
    hippocampus_amygdala: [17, 18, 53, 54]
  csf_offset: 10000
