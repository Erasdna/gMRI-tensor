name: Check package formatting

on:
  pull_request:
    # The CI is executed on every pull request to the main branch
    branches:
      - main

  # This workflow can be executed inside another workfow file
  workflow_call:

  schedule:
    # The CI is executed every day at 8am
    - cron: "0 8 * * *"
jobs:
  check-code:
    # This skips running the test if '[ci skip]' or '[skip ci]' is in the commit message
    # if: "!(contains(github.event.head_commit.message, '[ci skip]') || contains(github.event.head_commit.message, '[skip ci]'))"

    # Choose which operating system to run on, for more options see:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # Must match requires-python = ">=3.10" in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # This action sets the current path to the root of your github repo
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Install code"
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Flake8 code
        run: uv run flake8

      - name: Mypy check
        run: uv run mypy
