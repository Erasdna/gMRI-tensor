name: Bug report
description: Create a report if you believe something is not working
title: "[BUG]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: How to reproduce the bug
      description: Tell us how one can reproduce the bug
      placeholder: The `gmri` command (with its arguments) or the Python code that fails
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: If you get an error message or any output, please add it here
      render: bash
      placeholder: |
        gmri decompose: error: ...
    validations:
      required: false
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - 0.2.0
        - main branch
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: system
      description: What operating system are you using?
      placeholder: i.e. "I'm Ubuntu 20.04" or "Im using Windows 11"
  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: If you have any additional information, please add it here.
      placeholder: You can drag and drop files here to attach them
