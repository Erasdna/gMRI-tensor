[build-system]
requires = ["setuptools>=61.0.0", "wheel"]

[project]
name = "gMRItensor"
authors = [
    {name = "Andreas R. Solheim", email = "solheim@simula.no"},
    ]
version = "0.2.0"
description = "Tensor decompositions (CP, PARAFAC2, CMF) of gadolinium-enhanced MRI time series, with preprocessing, group statistics and figures"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "h5py>=3.16.0",
    # Upper-bounded deliberately: gMRItensor.decomposition reads the PARAFAC2
    # basis/coordinate matrices out of matcouply's ADMM auxiliary variables
    # (`auxes[1][0]`), which is internal layout rather than public API.
    "matcouply>=0.2.0,<0.3",
    # `loc="outside ..."` legends need 3.7.
    "matplotlib>=3.7",
    "nibabel>=5.4.2",
    "numexpr>=2.14.1",
    'numpy',
    "pandas>=2.0",
    "pyarrow>=25.0.1",
    "scienceplots>=2.2.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.10",
    "seaborn>=0.13.2",
    "statannotations>=0.7.2",
    "statsmodels>=0.14.6",
    "tensorly>=0.9.0",
    "threadpoolctl>=3.6.0",
    "tlviz>=0.1.1",
    "torch>=2.13.0",
    "tqdm>=4.69.1",
]


[project.scripts]
gmri = "gMRItensor.cli:main"

[tool.mypy]
ignore_missing_imports = true # Does not show errors when importing untyped libraries
exclude = [
    "docs/",
    "build/"
]
files = [
    "src",
    "test"
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov=gMRItensor",
    "--cov-report=html",
    "--cov-report=term-missing",
    "-v"]

testpaths = [
    "test"
]
markers = [
    "slow: long-running; skipped unless pytest is given --runslow",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
